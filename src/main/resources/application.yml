logging:
  level:
    org.springframework.retry: DEBUG

server:
  port: 8181
  tomcat: # 200 active + 100 queued = 300 => Connection #301 is immediately refused by the OS (Connection refused / TCP RST).
    threads:
      max: 200  #Tomcat will execute up to 200 requests concurrently
      min-spare: 50 #50 threads remain pre-spawned and ready (min-spare: 50), avoiding thread-creation lag when traffic arrives.
    accept-count: 100 #If all 200 threads are busy, up to 100 incoming TCP connections wait in the OS socket queue (accept-count: 100

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: duck-explore

management:
  endpoints:
    web:
      exposure:
        include: "health,metrics,prometheus"
  prometheus:
    metrics:
      export:
        enabled: true